<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12F Apartment Massing V2</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0d0f11;color:#eee;font-family:Arial,"Noto Sans TC",sans-serif}#ui{position:fixed;z-index:5;top:12px;left:12px;right:12px;max-width:540px;background:#151719e8;border:1px solid #444;border-radius:12px;padding:12px;box-sizing:border-box}b{font-size:20px}.sub{color:#aaa;margin:3px 0 9px}.row{display:flex;gap:6px;flex-wrap:wrap}button{background:#24282c;color:#eee;border:1px solid #555;border-radius:7px;padding:8px 11px;font-size:15px}button.on{background:#e6e0d4;color:#111}.hint{font-size:12px;color:#888;margin-top:7px}</style></head><body><div id="ui"><b>12F Apartment · Geometric Massing V2</b><div class="sub">53-part geometric study / orthographic elevations</div><div class="row"><button data-v="3d" class="on">3D</button><button data-v="front">Front</button><button data-v="back">Back</button><button data-v="left">Left</button><button data-v="right">Right</button><button id="wire">Wireframe</button></div><div class="hint">以同一組 3D 幾何產生四向立面；拖曳旋轉、雙指縮放。</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x0d0f11);const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;document.body.appendChild(ren.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x24282d,2.4));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-25,-35,55);scene.add(sun);const root=new THREE.Group();scene.add(root);const light=new THREE.MeshStandardMaterial({color:0xd8d4ca,roughness:.72});const dark=new THREE.MeshStandardMaterial({color:0x3b3e41,roughness:.8});const slab=new THREE.MeshStandardMaterial({color:0xa9a59d,roughness:.8});const mats=[];function B(n,x,y,z,sx,sy,sz,m=light){const q=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);q.name=n;q.position.set(x,y,z+sz/2);root.add(q);mats.push(m);return q}B('LeftTower',-6.5,0,0,4.8,12,35);B('CoreTower',0,.7,0,4.7,10.6,41);B('RightTower',6.1,0,0,4.8,12,37);B('GroundPlinth',0,0,0,18,14,3.6,slab);B('EntryCanopy',0,-7.8,3.3,6.5,1.8,.45,slab);B('LeftBand',-3.5,-6.35,3.6,1.7,.7,28.6,dark);B('CenterBand',2.2,-6.35,6.8,1.5,.7,30.5,dark);B('RightBand',6.5,-6.35,6.8,1.5,.7,27,dark);const fh=3.2;[[2,-6.1,3.6],[3,-6.1,3.6],[4,-6.1,3.6],[5,5.2,3.8],[6,5.2,3.8],[7,5.2,3.8],[8,-6.1,3.6],[9,-6.1,3.6],[10,5.2,3.8],[11,5.2,3.8]].forEach(([f,x,w])=>B('Balcony'+f,x,-7.45,fh*f,w,2.1,.28,slab));[3,4,6,7,9].forEach(f=>B('CenterBalcony'+f,.2,-7.2,fh*f,3.3,1.6,.26,slab));function frame(n,cx,z,w,h,y=-6.75,d=.9,t=.52){B(n+'L',cx-w/2+t/2,y,z,t,d,h);B(n+'R',cx+w/2-t/2,y,z,t,d,h);B(n+'B',cx,y,z,w,d,t);B(n+'T',cx,y,z+h-t,w,d,t)}frame('Low',-4.7,3.9,5,11.8);frame('Mid',.5,13.3,5.6,13);frame('Right',5.6,16.6,5,13.2);frame('Top',-2.3,28,6.5,12);B('RoofLeft',-6.1,.7,35,4.3,10.6,3);B('RoofRight',6.1,.7,37,4.3,10.6,2.5);frame('Crown',1.8,33.7,6.2,7,-.3,.8,.5);[3,5,7,9].forEach(f=>B('SideL'+f,-9.5,-1.2,fh*f,1.8,4.4,.26,slab));[4,6,8,10].forEach(f=>B('SideR'+f,9.5,.9,fh*f,1.8,4.4,.26,slab));const box=new THREE.Box3().setFromObject(root),c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());root.position.sub(c);const grid=new THREE.GridHelper(70,35,0x4b4f53,0x24272a);grid.rotation.x=Math.PI/2;grid.position.z=-c.z;scene.add(grid);const pc=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,300);pc.up.set(0,0,1);pc.position.set(35,-46,29);const oc=new THREE.OrthographicCamera();oc.up.set(0,0,1);let cam=pc;const ctl=new OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.target.set(0,0,0);function orthoFit(){const aspect=innerWidth/innerHeight,k=Math.max(sz.z*.58,sz.x*.8);oc.left=-k*aspect;oc.right=k*aspect;oc.top=k;oc.bottom=-k;oc.near=.1;oc.far=300;oc.updateProjectionMatrix()}orthoFit();function setView(v){document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='3d'){cam=pc;ctl.object=pc;pc.position.set(35,-46,29);pc.lookAt(0,0,0)}else{cam=oc;ctl.object=oc;const p={front:[0,-100,0],back:[0,100,0],left:[-100,0,0],right:[100,0,0]}[v];oc.position.set(...p);oc.lookAt(0,0,0)}ctl.target.set(0,0,0);ctl.update()}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setView(b.dataset.v));document.getElementById('wire').onclick=()=>{const on=!light.wireframe;new Set(mats).forEach(m=>m.wireframe=on)};addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);pc.aspect=innerWidth/innerHeight;pc.updateProjectionMatrix();orthoFit()});ren.setAnimationLoop(()=>{ctl.update();ren.render(scene,cam)});setView('3d');</script></body></html>
