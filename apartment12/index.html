<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Apartment V4 Four Elevations</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0e1012;font-family:Arial,"Noto Sans TC",sans-serif}canvas{display:block}#bar{position:fixed;z-index:9;top:8px;left:8px;right:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}button{pointer-events:auto;background:#202428dd;color:#eee;border:1px solid #555;border-radius:7px;padding:7px 9px;font-size:12px}button.on{background:#e5dfd3;color:#111}</style></head><body><div id="bar"><button data-v="design" class="on">Design</button><button data-v="front">Front</button><button data-v="right">Right</button><button data-v="back">Back</button><button data-v="left">Left</button><button id="wire">Wire</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const S=new T.Scene();S.background=new T.Color(0x0e1012);const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);S.add(new T.HemisphereLight(0xffffff,0x282d32,2.7));const dl=new T.DirectionalLight(0xffffff,3);dl.position.set(-25,-35,50);S.add(dl);const G=new T.Group();S.add(G);const W=new T.MeshStandardMaterial({color:0xd9d5cc,roughness:.72}),D=new T.MeshStandardMaterial({color:0x34383d,roughness:.82}),L=new T.MeshStandardMaterial({color:0xa9a59c,roughness:.8}),GL=new T.MeshStandardMaterial({color:0x59646c,roughness:.25,transparent:true,opacity:.6});const mats=[W,D,L,GL];function b(n,x,y,z,w,d,h,m=W){const q=new T.Mesh(new T.BoxGeometry(w,d,h),m);q.name=n;q.position.set(x,y,z+h/2);G.add(q)}function fx(n,x,y,z,w,h,axis='x',m=W,t=.48,dep=.8){if(axis==='x'){b(n+'l',x-w/2+t/2,y,z,t,dep,h,m);b(n+'r',x+w/2-t/2,y,z,t,dep,h,m);b(n+'b',x,y,z,w,dep,t,m);b(n+'t',x,y,z+h-t,w,dep,t,m)}else{b(n+'l',x,y-w/2+t/2,z,dep,t,h,m);b(n+'r',x,y+w/2-t/2,z,dep,t,h,m);b(n+'b',x,y,z,dep,w,t,m);b(n+'t',x,y,z+h-t,dep,w,t,m)}}const H=3.2;b('podium',0,0,0,18,14,3.4,W);

b('coreC',0,.6,3.4,5.1,10.6,37.8,D);b('coreL',-5.8,.4,3.4,4.8,11.2,31.8,D);b('coreR',5.8,.2,3.4,4.8,11.5,34.8,D);

for(let f=2;f<=9;f++){if(![5,8].includes(f))b('FB_L'+f,-5.5,-6.65,3.4+f*H,4.4,2,.24,W);if(![4,7].includes(f))b('FB_R'+f,5.5,-6.65,3.4+f*H,4.4,2,.24,W)}
fx('FF1',-4.5,-6.05,3.6,5.2,13.3);fx('FF2',.1,-6.05,12.8,5.7,13.8);fx('FF3',4.8,-6.05,18.7,5.2,14.4);fx('FF4',-2.7,-6.05,27,6.3,12.5);

// dark vertical spines on all elevations
b('frontSpine',2,-6.2,14,1.15,.75,25,D);b('backSpine',-1.8,6.2,11,1.2,.75,24,D);b('leftSpine',-8.4,-1,12,.75,1.15,23,D);b('rightSpine',8.4,1,15,.75,1.15,22,D);

const box=new T.Box3().setFromObject(G),c=box.getCenter(new T.Vector3()),sz=box.getSize(new T.Vector3());G.position.sub(c);const grid=new T.GridHelper(68,34,0x45494d,0x232629);grid.rotation.x=Math.PI/2;grid.position.z=-c.z;S.add(grid);const P=new T.PerspectiveCamera(34,innerWidth/innerHeight,.1,300);P.up.set(0,0,1);const O=new T.OrthographicCamera();O.up.set(0,0,1);let C=P;const ctl=new OrbitControls(P,R.domElement);ctl.enableDamping=true;function fit(){let a=innerWidth/innerHeight,k=Math.max(sz.z*.58,sz.x*.85);O.left=-k*a;O.right=k*a;O.top=k;O.bottom=-k;O.near=.1;O.far=300;O.updateProjectionMatrix()}fit();function v(n){document.querySelectorAll('[data-v]').forEach(e=>e.classList.toggle('on',e.dataset.v===n));if(n==='design'){C=P;ctl.object=P;P.position.set(31,-43,26);P.lookAt(0,0,0)}else{C=O;ctl.object=O;let p={front:[0,-100,0],right:[100,0,0],back:[0,100,0],left:[-100,0,0]}[n];O.position.set(...p);O.lookAt(0,0,0)}ctl.target.set(0,0,0);ctl.update()}document.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>v(e.dataset.v));document.getElementById('wire').onclick=()=>mats.forEach(m=>m.wireframe=!m.wireframe);addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);P.aspect=innerWidth/innerHeight;P.updateProjectionMatrix();fit()});R.setAnimationLoop(()=>{ctl.update();R.render(S,C)});v('design');</script></body></html>
