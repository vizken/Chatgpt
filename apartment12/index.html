<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Apartment V3</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#101214;font-family:Arial,"Noto Sans TC",sans-serif}canvas{display:block}#bar{position:fixed;z-index:10;top:8px;left:8px;right:8px;display:flex;gap:5px;align-items:center;pointer-events:none}#bar>*{pointer-events:auto}#title{background:#151719dd;color:#eee;border:1px solid #444;border-radius:8px;padding:7px 9px;font-weight:700;font-size:13px}button{background:#202428dd;color:#eee;border:1px solid #555;border-radius:7px;padding:7px 9px;font-size:13px}button.on{background:#e5dfd3;color:#111}@media(max-width:600px){#title{display:none}button{padding:7px 8px;font-size:12px}#bar{justify-content:center}}</style></head><body><div id="bar"><span id="title">12F Apartment · V3</span><button data-v="3d" class="on">3D</button><button data-v="front">Front</button><button data-v="back">Back</button><button data-v="left">Left</button><button data-v="right">Right</button><button id="wire">Wire</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const S=new T.Scene();S.background=new T.Color(0x101214);const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;document.body.appendChild(R.domElement);S.add(new T.HemisphereLight(0xffffff,0x30343a,2.6));const dl=new T.DirectionalLight(0xffffff,3);dl.position.set(-18,-30,45);S.add(dl);const G=new T.Group();S.add(G);const white=new T.MeshStandardMaterial({color:0xd8d4cb,roughness:.7}),dark=new T.MeshStandardMaterial({color:0x303338,roughness:.82}),glass=new T.MeshStandardMaterial({color:0x59636b,roughness:.3,transparent:true,opacity:.62}),slab=new T.MeshStandardMaterial({color:0xaaa69e,roughness:.8});const mats=[white,dark,glass,slab];function b(n,x,y,z,w,d,h,m=white){const q=new T.Mesh(new T.BoxGeometry(w,d,h),m);q.name=n;q.position.set(x,y,z+h/2);G.add(q);return q}const H=3.2;
// Ground / podium
b('podium',0,0,0,18,13.5,3.5,white);b('entry',2,-7.3,3.1,7.2,2,.45,dark);
// Instead of three full towers, use narrower staggered structural/residential bars
b('leftRear',-6.6,1,3.5,3.8,10.5,31.5,dark);b('centerCore',-.7,1.6,3.5,4.2,9.5,37.5,dark);b('rightRear',5.8,1.2,3.5,4.3,10,34.5,dark);
// floor plates create actual stepped silhouette
for(let f=1;f<=10;f++){let z=3.5+f*H;let w=16.2-(f>8?1.2:0);let x=f>8?-.6:0;b('floor'+f,x,0,z,w,11.5,.22,slab)}
// front window/recess panels between balcony systems
for(let f=1;f<=10;f++){let z=3.7+f*H;b('winL'+f,-4.4,-5.65,z,2.7,.22,2.45,glass);b('winC'+f,.1,-5.1,z,2.4,.22,2.45,glass);b('winR'+f,4.7,-5.65,z,2.7,.22,2.45,glass)}
// continuous balcony stacks, then interrupted by frames
for(let f=2;f<=9;f++){let z=3.5+f*H;if(![5,8].includes(f))b('balL'+f,-5.7,-6.75,z,4.4,2.2,.25,white);if(![4,7].includes(f))b('balR'+f,5.6,-6.75,z,4.5,2.2,.25,white)}
for(let f of[3,4,6,8])b('balC'+f,.1,-6.25,3.5+f*H,3.2,1.7,.25,dark);
// giant frames integrated into facade
function frame(n,x,z,w,h,d=.85,t=.5,y=-6.15,m=white){b(n+'L',x-w/2+t/2,y,z,t,d,h,m);b(n+'R',x+w/2-t/2,y,z,t,d,h,m);b(n+'B',x,y,z,w,d,t,m);b(n+'T',x,y,z+h-t,w,d,t,m)}
frame('F1',-4.4,3.6,5.2,13.2);frame('F2',.1,12.8,5.6,13.8);frame('F3',4.8,18.8,5.1,14.2);frame('F4',-2.7,27.0,6.1,12.3);
// tall vertical fins/spines
b('spineL',-7.8,-5.8,8,1.05,.85,26,dark);b('spineC',2.1,-5.85,15,1.15,.85,24,dark);b('spineR',7.7,-5.8,11,1,.85,25,dark);
// crown/open terraces and top step
b('topCenter',-.8,1.5,38,4.4,9.2,3.1,white);b('topLeft',-5.5,1,35,4,9.8,3,white);frame('crown',2.2,34.5,5.5,6.7,1,.55,-1.8,white);
// side projecting balconies to give 3D depth
for(let f of[3,5,7,9])b('sideL'+f,-9,-.8,3.5+f*H,2,4.2,.25,white);for(let f of[2,4,6,8])b('sideR'+f,9,.7,3.5+f*H,2,4.3,.25,white);
// vertical timber-like fin blocks
for(let i=0;i<7;i++)b('fin'+i,1.45+i*.2,-6.65,28,.08,.3,7,dark);
const box=new T.Box3().setFromObject(G),c=box.getCenter(new T.Vector3()),sz=box.getSize(new T.Vector3());G.position.sub(c);const grid=new T.GridHelper(65,32,0x44484c,0x24272a);grid.rotation.x=Math.PI/2;grid.position.z=-c.z;S.add(grid);const P=new T.PerspectiveCamera(34,innerWidth/innerHeight,.1,300);P.up.set(0,0,1);P.position.set(31,-43,26);const O=new T.OrthographicCamera();O.up.set(0,0,1);let C=P;const ctl=new OrbitControls(C,R.domElement);ctl.enableDamping=true;function fit(){const a=innerWidth/innerHeight,k=Math.max(sz.z*.57,sz.x*.82);O.left=-k*a;O.right=k*a;O.top=k;O.bottom=-k;O.near=.1;O.far=300;O.updateProjectionMatrix()}fit();function view(v){document.querySelectorAll('[data-v]').forEach(e=>e.classList.toggle('on',e.dataset.v===v));if(v==='3d'){C=P;ctl.object=P;P.position.set(31,-43,26);P.lookAt(0,0,0)}else{C=O;ctl.object=O;const p={front:[0,-100,0],back:[0,100,0],left:[-100,0,0],right:[100,0,0]}[v];O.position.set(...p);O.lookAt(0,0,0)}ctl.target.set(0,0,0);ctl.update()}document.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>view(e.dataset.v));document.getElementById('wire').onclick=()=>mats.forEach(m=>m.wireframe=!m.wireframe);addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);P.aspect=innerWidth/innerHeight;P.updateProjectionMatrix();fit()});R.setAnimationLoop(()=>{ctl.update();R.render(S,C)});view('3d');</script></body></html>
