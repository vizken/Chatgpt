<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12F Apartment Massing</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#eee;font-family:Arial,"Noto Sans TC",sans-serif}#ui{position:fixed;z-index:5;top:14px;left:14px;background:#151515dd;border:1px solid #444;border-radius:10px;padding:12px}.row{display:flex;gap:6px;flex-wrap:wrap;max-width:360px}button{background:#262626;color:#eee;border:1px solid #555;border-radius:6px;padding:7px 10px;cursor:pointer}button:hover{background:#3a3a3a}small{color:#aaa}</style></head><body><div id="ui"><b>12F Apartment · Massing Study</b><div><small>同一幾何母體／四向正交立面檢視</small></div><div class="row"><button data-v="persp">3D</button><button data-v="front">Front</button><button data-v="back">Back</button><button data-v="left">Left</button><button data-v="right">Right</button><button id="wire">Wireframe</button></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x111315);const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(devicePixelRatio);r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);const pc=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,500);const oc=new THREE.OrthographicCamera(-15,15,22,-22,.1,500);let cam=pc;pc.position.set(35,-42,30);const ctl=new OrbitControls(pc,r.domElement);ctl.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x30343a,2.2));const dl=new THREE.DirectionalLight(0xffffff,2.5);dl.position.set(20,-25,45);scene.add(dl);const root=new THREE.Group();scene.add(root);const mat=new THREE.MeshStandardMaterial({color:0xd7d2c7,roughness:.78,metalness:0});function box(x0,x1,y0,y1,z0,z1){const g=new THREE.BoxGeometry((x1-x0)/1000,(y1-y0)/1000,(z1-z0)/1000);const m=new THREE.Mesh(g,mat);m.position.set((x0+x1)/2000,(y0+y1)/2000,(z0+z1)/2000);root.add(m)}box(-9000,9730,-8550,7545,0,39400);box(8630,9730,-5450,-1150,7400,15080);box(550,6450,6750,8350,7510,7790);box(550,6450,6750,8350,13910,14190);box(-6250,250,-8550,-6750,17110,17390);box(550,6450,6750,8350,20310,20590);box(550,6450,6750,8350,26710,26990);const grid=new THREE.GridHelper(60,30,0x555555,0x292929);grid.rotation.x=Math.PI/2;grid.position.z=0;scene.add(grid);const b=new THREE.Box3().setFromObject(root),c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3());root.position.sub(c);grid.position.x=-c.x;grid.position.y=-c.y;ctl.target.set(0,0,0);function fitOrtho(){const a=innerWidth/innerHeight,k=Math.max(s.x,s.y,s.z)*.68;oc.left=-k*a;oc.right=k*a;oc.top=k;oc.bottom=-k;oc.updateProjectionMatrix()}fitOrtho();function view(v){ctl.object=oc;cam=oc;ctl.target.set(0,0,0);if(v==='front')oc.position.set(0,-80,0);if(v==='back')oc.position.set(0,80,0);if(v==='left')oc.position.set(-80,0,0);if(v==='right')oc.position.set(80,0,0);oc.up.set(0,0,1);oc.lookAt(0,0,0);ctl.update();if(v==='persp'){cam=pc;ctl.object=pc;pc.up.set(0,0,1);pc.position.set(35,-42,30);pc.lookAt(0,0,0);ctl.update()}}document.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>view(x.dataset.v));document.getElementById('wire').onclick=()=>{mat.wireframe=!mat.wireframe};addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);pc.aspect=innerWidth/innerHeight;pc.updateProjectionMatrix();fitOrtho()});r.setAnimationLoop(()=>{ctl.update();r.render(scene,cam)});view('persp');</script></body></html>
