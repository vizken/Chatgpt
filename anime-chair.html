<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Anime.js Red Blue Chair Demo</title>
<style>
  :root{--bg:#0f0f10;--panel:#171719;--line:#2b2b2f;--text:#f4f4f5;--muted:#a9a9b0;--red:#d8232a;--blue:#2456ad;--yellow:#efc229;--black:#121214}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans TC",sans-serif}
  body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
  header strong{margin-right:8px}
  button{border:1px solid #555;background:#242428;color:#fff;border-radius:7px;padding:8px 11px;cursor:pointer}
  button:hover{background:#303036}
  .note{margin-left:auto;color:var(--muted);font-size:12px}
  main{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden}
  .stage{position:relative;width:min(92vw,900px);height:min(78vh,720px);display:grid;place-items:center}
  svg{width:100%;height:100%;overflow:visible}
  .shadow{filter:drop-shadow(0 18px 18px rgba(0,0,0,.38))}
  .part{transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
  .wood{fill:#171719;stroke:#2c2c31;stroke-width:2}
  .red{fill:var(--red)}
  .blue{fill:var(--blue)}
  .yellow{fill:var(--yellow)}
  .guide{stroke:#3c3c43;stroke-width:1;stroke-dasharray:6 6;opacity:.45}
  .caption{position:absolute;left:18px;bottom:16px;max-width:520px;color:#bdbdc4;font-size:13px;line-height:1.55;background:rgba(15,15,16,.7);padding:10px 12px;border-radius:8px;border:1px solid #25252a;backdrop-filter:blur(4px)}
  .badge{position:absolute;right:18px;bottom:16px;font-size:12px;color:#ccc;background:#18181b;border:1px solid #303036;border-radius:999px;padding:6px 9px}
  @media(max-width:700px){.note{width:100%;margin-left:0}.caption{max-width:78vw;font-size:12px}.badge{display:none}}
</style>
</head>
<body>
<header>
  <strong>Anime.js — Red & Blue Chair</strong>
  <button id="assemble">組裝</button>
  <button id="explode">分解</button>
  <button id="tilt">視角</button>
  <button id="sequence">完整動畫</button>
  <button id="reset">重置</button>
  <span class="note">SVG + Anime.js。不是 Three.js 真 3D。</span>
</header>
<main>
  <div class="stage">
    <svg id="chairSvg" viewBox="0 0 900 720" role="img" aria-label="Red and Blue Chair stylized SVG reconstruction">
      <line class="guide" x1="120" y1="620" x2="780" y2="620" />
      <g id="chair" class="shadow">
        <!-- rear frame -->
        <rect class="part wood" data-part="frame" x="260" y="120" width="28" height="470" rx="2" transform="rotate(-4 274 355)"/>
        <rect class="part wood" data-part="frame" x="620" y="112" width="28" height="485" rx="2" transform="rotate(3 634 355)"/>

        <!-- backrest: slightly reclined red plane -->
        <polygon class="part red" data-part="back" points="318,142 596,130 606,337 329,348"/>

        <!-- upper cross rail -->
        <polygon class="part wood" data-part="frame" points="234,305 684,294 686,322 237,334"/>

        <!-- seat: recognizable blue sloping plane -->
        <polygon class="part blue" data-part="seat" points="345,355 604,346 667,476 382,490"/>

        <!-- front/rear long rails around seat -->
        <polygon class="part wood" data-part="frame" points="292,474 673,458 678,487 296,505"/>
        <polygon class="part wood" data-part="frame" points="333,344 620,334 626,359 338,371"/>

        <!-- lower front legs / side posts -->
        <rect class="part wood" data-part="frame" x="292" y="356" width="28" height="245" rx="2" transform="rotate(-3 306 478)"/>
        <rect class="part wood" data-part="frame" x="661" y="352" width="28" height="252" rx="2" transform="rotate(3 675 478)"/>

        <!-- side rails -->
        <polygon class="part wood" data-part="frame" points="250,518 390,511 393,538 252,548"/>
        <polygon class="part wood" data-part="frame" points="598,507 731,515 730,543 597,535"/>

        <!-- colored terminal accents -->
        <polygon class="part yellow" data-part="accent" points="218,517 256,516 258,549 220,552"/>
        <polygon class="part yellow" data-part="accent" points="729,515 770,520 768,550 728,544"/>
        <polygon class="part yellow" data-part="accent" points="620,111 649,110 651,143 622,144"/>

        <!-- small black visual intersections for Rietveld-like joint rhythm -->
        <rect class="part wood" data-part="frame" x="274" y="570" width="94" height="26" transform="rotate(-3 321 583)"/>
        <rect class="part wood" data-part="frame" x="586" y="571" width="101" height="26" transform="rotate(3 636 584)"/>
      </g>
    </svg>
    <div class="caption">這版先把「紅藍椅」的辨識特徵做對：紅色後傾靠背、藍色座板、黑色桿件交錯、少量黃色端部。Anime.js 只負責構件分解、回組與視角節奏。</div>
    <div class="badge">SVG / Anime.js 4</div>
  </div>
</main>
<script type="module">
  import { animate, createTimeline, stagger } from 'https://cdn.jsdelivr.net/npm/animejs@4.2.2/+esm';

  const chair = document.querySelector('#chair');
  const back = document.querySelector('[data-part="back"]');
  const seat = document.querySelector('[data-part="seat"]');
  const frames = [...document.querySelectorAll('[data-part="frame"]')];
  const accents = [...document.querySelectorAll('[data-part="accent"]')];
  const all = [...document.querySelectorAll('.part')];
  let active = null;

  function stop(){ if(active?.pause) active.pause(); active=null; }

  function reset(){
    stop();
    all.forEach(el=>{
      el.style.translate='0px 0px';
      el.style.rotate='0deg';
      el.style.scale='1';
      el.style.opacity='1';
    });
    chair.style.transform='translate(0px,0px) rotate(0deg) scale(1)';
  }

  function explode(){
    stop();
    active=createTimeline({defaults:{duration:900,ease:'inOut(3)'}});
    active.add(back,{x:-90,y:-95,rotate:-8,scale:.96},0)
          .add(seat,{x:95,y:55,rotate:7,scale:.96},70)
          .add(frames,{x:(el,i)=>i%2===0?-65:65,y:(el,i)=>(i-frames.length/2)*5,rotate:(el,i)=>i%2===0?-5:5,delay:stagger(28)},110)
          .add(accents,{x:(el,i)=>[-95,95,70][i]??70,y:(el,i)=>[45,45,-75][i]??0,delay:stagger(70)},240);
  }

  function assemble(){
    stop();
    active=animate(all,{x:0,y:0,rotate:0,scale:1,opacity:1,duration:950,delay:stagger(26,{from:'center'}),ease:'out(4)'});
  }

  function tilt(){
    stop();
    active=createTimeline({defaults:{ease:'inOutSine'}})
      .add(chair,{x:[0,-28,24,0],y:[0,-8,8,0],rotate:[0,-4,3,0],scale:[1,1.035,1.02,1],duration:2800});
  }

  function sequence(){
    reset();
    active=createTimeline({defaults:{ease:'inOut(3)'}});
    active.add(chair,{scale:[.92,1],y:[20,0],duration:700});
    active.add(back,{x:-90,y:-95,rotate:-8,duration:750},650)
          .add(seat,{x:95,y:55,rotate:7,duration:750},700)
          .add(frames,{x:(el,i)=>i%2===0?-65:65,y:(el,i)=>(i-frames.length/2)*5,rotate:(el,i)=>i%2===0?-5:5,duration:720,delay:stagger(24)},720)
          .add(accents,{x:(el,i)=>[-95,95,70][i]??70,y:(el,i)=>[45,45,-75][i]??0,duration:650,delay:stagger(65)},790);
    active.add({}, {duration:600});
    active.add(all,{x:0,y:0,rotate:0,scale:1,duration:900,delay:stagger(22,{from:'center'}),ease:'out(4)'},1850);
    active.add(chair,{x:[0,-18,16,0],rotate:[0,-3,2,0],scale:[1,1.025,1],duration:1900,ease:'inOutSine'},2700);
  }

  document.querySelector('#explode').onclick=explode;
  document.querySelector('#assemble').onclick=assemble;
  document.querySelector('#tilt').onclick=tilt;
  document.querySelector('#sequence').onclick=sequence;
  document.querySelector('#reset').onclick=reset;

  sequence();
</script>
</body>
</html>
