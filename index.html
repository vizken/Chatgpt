<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIZKEN · Web Application Lab</title>
<style>
:root{color-scheme:dark;--bg:#0b1017;--panel:#151d29;--line:#2a394b;--txt:#e9eff6;--muted:#9aaec2;--gold:#e4bb75}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 system-ui,"Noto Sans TC",sans-serif}
header,main,footer{max-width:1200px;margin:auto;padding:28px 24px}
header{border-bottom:1px solid var(--line)}.eyebrow{color:var(--gold);letter-spacing:.22em;font-size:12px;font-weight:700}
h1{font-size:clamp(30px,5vw,58px);line-height:1.1;margin:12px 0}p{color:var(--muted)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select{background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:12px;font:inherit}
input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;min-height:235px}
.card:hover{border-color:var(--gold)}.id{font-size:12px;color:var(--gold);letter-spacing:.15em}.card h2{margin:12px 0 4px;font-size:23px}.card p{flex:1}
.meta{font-size:12px;color:var(--muted);margin-bottom:18px}.launch{display:inline-block;text-decoration:none;background:var(--gold);color:#111a22;border-radius:7px;padding:10px 16px;font-weight:800;align-self:flex-start}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line)}#status{min-height:25px}
</style></head><body>
<header><div class="eyebrow">VIZKEN / AIGC × WEB3D</div><h1>APPLICATION LAB</h1><p>獨立應用 · 統一入口 · 持續擴充。點選 Launch 在新分頁開啟完整應用。</p></header>
<main><div class="toolbar"><input id="search" type="search" placeholder="搜尋應用名稱或功能" aria-label="搜尋應用"><select id="category" aria-label="應用分類"><option value="">全部分類</option></select></div><p id="status" role="status">載入應用清單中…</p><section class="grid" id="apps" aria-label="應用程式"></section></main>
<footer>VIZKEN · GitHub Pages · Lab 2.0</footer>
<script>
let apps=[];const grid=document.getElementById('apps'),status=document.getElementById('status'),search=document.getElementById('search'),category=document.getElementById('category');
function render(){grid.replaceChildren();const q=search.value.trim().toLocaleLowerCase();const filtered=apps.filter(a=>(!category.value||a.category===category.value)&&[a.name,a.description,a.id].join(' ').toLocaleLowerCase().includes(q));status.textContent='共 '+filtered.length+' 個應用';
for(const a of filtered){const card=document.createElement('article');card.className='card';const id=document.createElement('div');id.className='id';id.textContent=a.id;const h=document.createElement('h2');h.textContent=a.name;const p=document.createElement('p');p.textContent=a.description;const m=document.createElement('div');m.className='meta';m.textContent=a.category+' · v'+a.version+' · '+a.status;const link=document.createElement('a');link.className='launch';link.textContent='Launch ↗';link.href=new URL(a.path,location.href).href;link.target='_blank';link.rel='noopener noreferrer';card.append(id,h,p,m,link);grid.append(card)}}
fetch('config/apps.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data.applications))throw Error('Invalid registry');apps=data.applications.filter(a=>a.status==='active'&&a.id&&a.name&&a.path);for(const c of [...new Set(apps.map(a=>a.category))].sort()){const opt=document.createElement('option');opt.value=c;opt.textContent=c;category.append(opt)}render()}).catch(e=>{status.textContent='無法載入應用清單：'+e.message;});
search.addEventListener('input',render);category.addEventListener('change',render);
</script></body></html>
